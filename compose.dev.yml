name: api-drift-${ENVIRONMENT}

services:
  app:
    working_dir: /app
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in your .env file}
    volumes:
      - .:/app
      - /app/.venv
    develop:
      watch:
        - action: rebuild
          path: pyproject.toml
    ports:
      - 3333:8000
    networks:
      - default
      - dev-postgres

networks:
  dev-postgres:
    name: dev-postgres_default
    external: true
